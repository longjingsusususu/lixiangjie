<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>会议活动服务需求汇总 · 流程图</title>
<style>
  body { margin: 0; padding: 32px 24px; background: #ffffff; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .fig { max-width: 1120px; margin: 0 auto; }
  svg { width: 100%; height: auto; display: block; }
  .cap { margin-top: 12px; font-size: 12px; color: #8a8a8a; line-height: 1.7; }
  @media print { body { padding: 0; } }
</style>
</head>
<body>
<div class="fig">
<svg viewBox="0 0 1120 680" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <title>会议活动服务需求汇总 · 端到端流程图</title>
  <desc>三个阶段的十一个步骤，标出交接点、复核判断点与只读数据读取点，以及三个已识别的失败位置。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="26" font-weight="500" fill="#1F1F1F" dominant-baseline="central">会议活动服务需求汇总</text>
  <text x="60" y="92" font-size="14" fill="#6B6B6B" dominant-baseline="central">端到端流程与三个关键控制点 ｜ 合成演练场景，仅使用本项目资料</text>
  <path d="M60 112H1060" stroke="#E5E3DC" stroke-width="1" fill="none"/>

  <rect x="40" y="136" width="1040" height="104" rx="12" fill="#FAF9F5" stroke="#EFEDE6" stroke-width="0.5"/>
  <text x="60" y="170" font-size="14" fill="#5F5E5A" dominant-baseline="central">① 登记与汇总</text>
  <rect x="40" y="256" width="1040" height="104" rx="12" fill="#FFFBF2" stroke="#F5E7C8" stroke-width="0.5"/>
  <text x="60" y="290" font-size="14" fill="#854F0B" dominant-baseline="central">② 交接与复核</text>
  <rect x="40" y="376" width="1040" height="104" rx="12" fill="#FAF9F5" stroke="#EFEDE6" stroke-width="0.5"/>
  <text x="60" y="410" font-size="14" fill="#5F5E5A" dominant-baseline="central">③ 闭环与复盘</text>

  <g>
    <rect x="240" y="158" width="170" height="64" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="325" y="183" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">S1 议程确认</text>
    <text x="325" y="205" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">主办方 / 顾明岚</text>
  </g>
  <g>
    <rect x="440" y="158" width="170" height="64" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="525" y="183" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">S2 嘉宾需求登记</text>
    <text x="525" y="205" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">设备与语言分人记录</text>
  </g>
  <g>
    <rect x="640" y="158" width="170" height="64" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="725" y="183" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">S3 汇总成清单</text>
    <text x="725" y="205" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">唐映秋 · 50 项</text>
  </g>
  <g>
    <rect x="840" y="158" width="170" height="64" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="925" y="183" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">S4 生成版本</text>
    <text x="925" y="205" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">唐映秋 · 有效期 + 确认</text>
  </g>
  <path d="M410 190H434" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M610 190H634" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M810 190H834" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

  <path d="M925 222V248H325V274" fill="none" stroke="#B4B2A9" stroke-width="1" marker-end="url(#ar)"/>

  <g>
    <rect x="240" y="278" width="170" height="64" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="325" y="303" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">H1 交接</text>
    <text x="325" y="325" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">签字 · 版本 · 未结项</text>
  </g>
  <g>
    <rect x="440" y="278" width="170" height="64" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="525" y="303" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">R1 版本一致性复核</text>
    <text x="525" y="325" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">傅景 · 不一致即退回</text>
  </g>
  <g>
    <rect x="640" y="278" width="170" height="64" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="725" y="303" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">D1 只读导出</text>
    <text x="725" y="325" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">秦芮 · 双时间戳</text>
  </g>
  <g>
    <rect x="840" y="278" width="170" height="64" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="925" y="303" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">R2 异常识别</text>
    <text x="925" y="325" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">无法确认即入人工队列</text>
  </g>
  <path d="M410 310H434" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M610 310H634" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M810 310H834" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

  <path d="M925 342V368H325V394" fill="none" stroke="#B4B2A9" stroke-width="1" marker-end="url(#ar)"/>

  <g>
    <rect x="240" y="398" width="170" height="64" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="325" y="423" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">R3 人工复核闭环</text>
    <text x="325" y="445" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">值守人待定 · 傅景判定</text>
  </g>
  <g>
    <rect x="440" y="398" width="170" height="64" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="525" y="423" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">S9 执行与对外承诺</text>
    <text x="525" y="445" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">业务人员确认，模型无审批权</text>
  </g>
  <g>
    <rect x="640" y="398" width="170" height="64" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="725" y="423" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">S10 复盘与客诉</text>
    <text x="725" y="445" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">叶书 · 每周误报漏报</text>
  </g>
  <path d="M410 430H434" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M610 430H634" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

  <g>
    <rect x="60" y="516" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="82" y="523" font-size="12" fill="#5F5E5A" dominant-baseline="central">执行步骤</text>
    <rect x="180" y="516" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="202" y="523" font-size="12" fill="#5F5E5A" dominant-baseline="central">交接点 / 判断点 / 只读读取点</text>
    <text x="450" y="523" font-size="12" fill="#A32D2D" dominant-baseline="central">红字为已识别的失败位置</text>
  </g>

  <text x="60" y="560" font-size="13" fill="#444441" dominant-baseline="central">失败起点｜S2 登记：同一嘉宾的设备与语言由不同人分别记录（f10）→ 拦截：关键字段强制填写（f31）</text>
  <text x="60" y="586" font-size="13" fill="#444441" dominant-baseline="central">断点一｜H1 交接：只发「已处理」、无责任转移时点（f20、f23）→ 拦截：顾明岚签字（REQ-1）</text>
  <text x="60" y="612" font-size="13" fill="#444441" dominant-baseline="central">断点二｜R3 复核：无人值守、无响应时限（f44）→ 拦截：傅景判定闭环 + 审计留痕（f45）</text>
  <text x="60" y="646" font-size="12" fill="#8A8A8A" dominant-baseline="central">合成业务场景；节点不代表该步骤已真实执行。真实接口、客户签核与业务收益需另行核实。</text>
</svg>
<div class="cap">说明：灰色为执行步骤，琥珀色为控制点（1 个交接点、3 个判断点、1 个只读读取点）。虚线折返表示阶段推进，不代表系统自动流转。</div>
</div>
</body>
</html>
