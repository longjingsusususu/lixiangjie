<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议活动需求 · 查询台</title>
<!--
  单页前端（HTML + 原生 JS，无构建）
  · 鉴权：登录拿 JWT，之后每个请求带 Authorization: Bearer
  · 流式：fetch 读 ReadableStream，按 SSE 帧（event/data）手工解析
  · 事件：status(检索中) → item(清单卡片×N) → chunk(打字机) → done(引用) / error
-->
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e5e7eb; --text:#1f2328; --sub:#6b7280;
    --brand:#2f6feb; --brand-soft:#eaf1fe; --danger:#d92d20; --danger-soft:#fef3f2;
    --warn:#b54708; --warn-soft:#fffaeb; --ok:#067647; --ok-soft:#ecfdf3;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px}
  input,textarea{font:inherit;outline:none}

  /* ── 登录页 ── */
  #login{height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:32px;width:360px;box-shadow:0 8px 28px rgba(15,23,42,.06)}
  .card h1{font-size:18px;margin-bottom:4px}
  .card p{color:var(--sub);font-size:13px;margin-bottom:20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
  .field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .btn-primary{width:100%;padding:11px;background:var(--brand);color:#fff;font-weight:500}
  .btn-primary:hover{filter:brightness(.95)}
  .hint{font-size:12px;color:var(--sub);margin-top:14px;text-align:center}

  /* ── 主界面 ── */
  #app{display:none;height:100vh;grid-template-columns:248px 1fr}
  #sidebar{background:var(--panel);border-right:1px solid var(--line);
           display:flex;flex-direction:column;padding:14px}
  .brand{font-weight:600;font-size:14px;padding:4px 6px 12px}
  .new-chat{padding:9px;background:var(--brand-soft);color:var(--brand);
            font-weight:500;margin-bottom:10px}
  .sess{flex:1;overflow-y:auto}
  .sess-item{padding:9px 10px;border-radius:8px;color:var(--sub);cursor:pointer;
             font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess-item:hover{background:var(--bg)}
  .sess-item.active{background:var(--brand-soft);color:var(--brand);font-weight:500}
  .user-bar{border-top:1px solid var(--line);padding-top:10px;display:flex;
            align-items:center;justify-content:space-between;font-size:13px}
  .user-bar button{background:none;color:var(--sub);font-size:12px;padding:4px}

  #main{display:flex;flex-direction:column;height:100vh;min-width:0}
  #chat{flex:1;overflow-y:auto;padding:26px 0}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}

  /* 消息气泡 */
  .msg{margin-bottom:20px}
  .msg.user .bubble{background:var(--brand);color:#fff;padding:10px 14px;
        border-radius:12px 12px 2px 12px;max-width:78%;margin-left:auto;width:fit-content}
  .msg.assistant .bubble{background:var(--panel);border:1px solid var(--line);
        padding:14px 16px;border-radius:12px 12px 12px 2px}

  /* 检索状态 */
  .status{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;
          padding:2px 0 8px}
  .dots span{display:inline-block;width:4px;height:4px;border-radius:50%;
        background:var(--sub);margin-left:3px;animation:blink 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* 需求项清单卡片 */
  .items{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
  .item{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;
        background:#fcfcfd}
  .item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .no{font-family:ui-monospace,Consolas,monospace;font-weight:600;font-size:12.5px}
  .tag{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--sub)}
  .tag.缺失{background:var(--danger-soft);color:var(--danger)}
  .tag.未确认{background:var(--warn-soft);color:var(--warn)}
  .tag.已确认,.tag.已定版,.tag.已交接{background:var(--ok-soft);color:var(--ok)}
  .item-body{margin-top:5px;font-size:13.5px}
  .item-meta{margin-top:6px;font-size:12px;color:var(--sub);
             display:flex;gap:14px;flex-wrap:wrap}

  /* 打字机输出 */
  .answer{font-size:14px;min-height:22px;white-space:pre-wrap}
  .caret{display:inline-block;width:7px;height:15px;background:var(--text);
         vertical-align:-2px;animation:caret 1s steps(1) infinite}
  @keyframes caret{50%{opacity:0}}

  /* 引用来源 */
  .cites{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);
         font-size:12.5px;color:var(--sub)}
  .cites b{font-weight:600;color:var(--text);font-size:12px}
  .cite{margin-top:5px}
  .cite .idx{color:var(--brand);font-weight:600;margin-right:4px}
  .cite .snip{color:var(--sub)}

  /* 错误横条 */
  .err{background:var(--danger-soft);color:var(--danger);border:1px solid #fecdca;
       padding:9px 12px;border-radius:8px;font-size:13px;margin:8px 0 14px}

  /* 输入区 */
  #composer{border-top:1px solid var(--line);background:var(--panel);padding:14px 0}
  .composer-inner{max-width:760px;margin:0 auto;padding:0 20px;display:flex;gap:10px}
  #q{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;
     padding:11px 13px;height:46px;max-height:150px}
  #q:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  #send{padding:0 20px;background:var(--brand);color:#fff;font-weight:500}
  #send:disabled{background:#c7d2e4;cursor:not-allowed}
  .tips{max-width:760px;margin:8px auto 0;padding:0 20px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>

<!-- ======================= 登录页 ======================= -->
<div id="login">
  <div class="card">
    <h1>会议活动需求 · 查询台</h1>
    <p>输入关键词查需求项，直接给缺项清单与来源位置</p>
    <div class="field">
      <label>用户名</label>
      <input id="u" value="yixian" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="p" type="password" value="123456" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="loginBtn">登录</button>
    <div class="hint" id="loginErr"></div>
    <div class="hint">演示账号：yixian / 123456　·　admin / admin123</div>
  </div>
</div>

<!-- ======================= 主界面 ======================= -->
<div id="app">
  <aside id="sidebar">
    <div class="brand">会议活动需求</div>
    <button class="new-chat" id="newChat">＋ 新的查询</button>
    <div class="sess" id="sessList"></div>
    <div class="user-bar">
      <span id="who">—</span>
      <button id="logout">退出</button>
    </div>
  </aside>

  <main id="main">
    <div id="chat"><div class="wrap" id="thread"></div></div>
    <div id="composer">
      <div class="composer-inner">
        <textarea id="q" placeholder="例如：双语主持相关的需求有哪些？（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send">发送</button>
      </div>
      <div class="tips">来源位置为原始单据与行号；清单未覆盖时不会编造答案。</div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   全局状态
   ============================================================ */
const S = {
  token: localStorage.getItem("mt_token") || "",
  name:  localStorage.getItem("mt_name")  || "",
  sessionId: null,        // 当前会话；null 表示"新查询"，由后端建会话
  sending: false,
  typer: null,            // 打字机定时器
};

const $ = (id) => document.getElementById(id);

/* ============================================================
   HTTP 封装：统一处理"先返回错误码 + 中文信息"
   ============================================================ */
async function api(path, opts = {}) {
  opts.headers = Object.assign(
    {"Content-Type": "application/json"},
    S.token ? {"Authorization": "Bearer " + S.token} : {},
    opts.headers || {}
  );
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* 可能是空响应 */ }
  if (!res.ok) {
    // 后端所有错误都是 {code, message}，直接抛出中文
    const msg = (data && data.message) ? `[${data.code}] ${data.message}` : `请求失败（HTTP ${res.status}）`;
    throw new Error(msg);
  }
  return data;
}

/* ============================================================
   登录 / 退出
   ============================================================ */
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try {
    const d = await api("/api/login", {
      method: "POST",
      body: JSON.stringify({username: $("u").value.trim(), password: $("p").value})
    });
    S.token = d.token; S.name = d.display_name;
    localStorage.setItem("mt_token", S.token);
    localStorage.setItem("mt_name", S.name);
    enterApp();
  } catch (e) {
    $("loginErr").textContent = e.message;   // 如 [40102] 用户名或密码错误
  }
};
$("p").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });

$("logout").onclick = () => {
  localStorage.removeItem("mt_token"); localStorage.removeItem("mt_name");
  location.reload();
};

function enterApp() {
  $("login").style.display = "none";
  $("app").style.display = "grid";
  $("who").textContent = S.name || "—";
  loadSessions();
}

/* ============================================================
   会话列表（侧栏）
   ============================================================ */
async function loadSessions() {
  try {
    const d = await api("/api/sessions");
    const box = $("sessList");
    box.innerHTML = "";
    d.items.forEach(s => {
      const el = document.createElement("div");
      el.className = "sess-item" + (s.id === S.sessionId ? " active" : "");
      el.textContent = s.title || "未命名查询";
      el.title = `${s.title}（${s.msg_count} 条记录）`;
      el.onclick = () => openSession(s.id);
      box.appendChild(el);
    });
  } catch (e) { /* 登录过期时静默，等下一次操作提示 */ }
}

/* 打开历史会话：拉全量消息回填 */
async function openSession(sid) {
  try {
    const d = await api(`/api/sessions/${sid}/messages`);
    S.sessionId = sid;
    $("thread").innerHTML = "";
    d.messages.forEach(m => {
      if (m.role === "user") {
        addUserBubble(m.content);
      } else {
        const {body, itemsBox, ansEl} = addAssistantShell();
        ansEl.textContent = m.content;         // 历史消息直接整段显示，不做打字机
        renderCitations(body, m.citations || []);
      }
    });
    scrollBottom();
    loadSessions();
  } catch (e) { alert(e.message); }
}

/* 新查询：清屏 + sessionId 置空 */
$("newChat").onclick = () => {
  S.sessionId = null;
  $("thread").innerHTML = "";
  loadSessions();
};

/* ============================================================
   消息渲染
   ============================================================ */
function addUserBubble(text) {
  const d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = `<div class="bubble"></div>`;
  d.querySelector(".bubble").textContent = text;
  $("thread").appendChild(d);
  scrollBottom();
  return d;
}

/* 助手消息壳：状态条 + 清单容器 + 答案区（引用稍后追加） */
function addAssistantShell() {
  const d = document.createElement("div");
  d.className = "msg assistant";
  d.innerHTML = `
    <div class="bubble">
      <div class="status"><span class="status-text">正在检索需求项…</span>
        <span class="dots"><span></span><span></span><span></span></span></div>
      <div class="items"></div>
      <div class="answer"></div>
    </div>`;
  $("thread").appendChild(d);
  scrollBottom();
  return {body: d.querySelector(".bubble"),
          itemsBox: d.querySelector(".items"),
          ansEl: d.querySelector(".answer"),
          statusEl: d.querySelector(".status")};
}

function addItemCard(box, it) {
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `
    <div class="item-top">
      <span class="no">${esc(it.item_no)}</span>
      <span class="tag">${esc(it.category || "")}</span>
      <span class="tag ${esc(it.status)}">${esc(it.status || "")}</span>
    </div>
    <div class="item-body">${esc(it.content)}</div>
    <div class="item-meta">
      <span>责任人：${esc(it.owner || "—")}</span>
      <span>来源：${esc(it.source_tool || "来源缺失")} ${esc(it.source_ref || "")}</span>
    </div>`;
  box.appendChild(el);
  scrollBottom();
}

/* 引用来源：来源工具｜单据号｜原始行位置 + 片段（f15 的"来源位置"） */
function renderCitations(container, cites) {
  if (!cites || cites.length === 0) return;
  const box = document.createElement("div");
  box.className = "cites";
  box.innerHTML = `<b>来源</b>`;
  cites.forEach((c, i) => {
    const row = document.createElement("div");
    row.className = "cite";
    row.innerHTML = `<span class="idx">${i + 1}.</span>`
      + `${esc(c.source_tool || "未知来源")}｜${esc(c.source_ref || "")}`
      + `　<span class="snip">${esc(c.snippet || "")}…</span>`;
    box.appendChild(row);
  });
  container.appendChild(box);
  scrollBottom();
}

function showError(container, message) {
  const el = document.createElement("div");
  el.className = "err";
  el.textContent = message;
  container.appendChild(el);
  scrollBottom();
}

/* ============================================================
   发送 + SSE 事件处理
   ============================================================ */
$("send").onclick = send;
$("q").addEventListener("keydown", async (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

async function send() {
  const q = $("q").value.trim();
  if (!q || S.sending) return;
  S.sending = true; $("send").disabled = true;
  $("q").value = "";
  addUserBubble(q);

  const shell = addAssistantShell();
  const {body, itemsBox, ansEl, statusEl} = shell;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": "Bearer " + S.token},
      body: JSON.stringify({session_id: S.sessionId, question: q})
    });

    // 非 200：后端返回 {code, message}，直接中文提示
    if (!res.ok) {
      const d = await res.json().catch(() => null);
      throw new Error(d ? `[${d.code}] ${d.message}` : `请求失败（HTTP ${res.status}）`);
    }

    // ── 手工解析 SSE：按空行（\n\n）切帧，再读 event/data 两行 ──
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});

      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const evLine = frame.split("\n").find(l => l.startsWith("event:"));
        const dataLine = frame.split("\n").find(l => l.startsWith("data:"));
        if (!evLine || !dataLine) continue;
        const ev = evLine.slice(6).trim();
        let data = {};
        try { data = JSON.parse(dataLine.slice(5).trim()); } catch (e) { continue; }
        handleEvent(ev, data, shell);
      }
    }
  } catch (e) {
    statusEl.style.display = "none";
    showError(body, e.message);     // 如 [50301] 检索索引未就绪…
  } finally {
    S.sending = false; $("send").disabled = false;
    $("q").focus();
  }
}

function handleEvent(ev, data, shell) {
  const {body, itemsBox, ansEl, statusEl} = shell;

  if (ev === "status") {
    statusEl.style.display = "flex";
    statusEl.querySelector(".status-text").textContent = data.message || "正在检索…";
    scrollBottom();

  } else if (ev === "item") {
    statusEl.style.display = "none";      // 首个结果到达即收起状态条
    addItemCard(itemsBox, data);

  } else if (ev === "chunk") {
    statusEl.style.display = "none";
    typeIn(ansEl, data.text || "");

  } else if (ev === "done") {
    S.sessionId = data.session_id;        // 后续追问挂到同一会话
    renderCitations(body, data.citations || []);
    const meta = document.createElement("div");
    meta.style.cssText = "font-size:12px;color:var(--sub);margin-top:8px";
    meta.textContent = `检索耗时 ${data.elapsed_ms} ms`;
    body.appendChild(meta);
    loadSessions();

  } else if (ev === "error") {
    statusEl.style.display = "none";
    showError(body, `[${data.code}] ${data.message}`);
  }
}

/* ============================================================
   打字机：chunk 文本进队列，定时器逐字上屏（18ms/字）
   ============================================================ */
const typeQueue = {el: null, chars: [], timer: null};

function typeIn(el, text) {
  if (typeQueue.el !== el) {             // 换了目标元素则重置队列
    typeQueue.el = el;
    typeQueue.chars = [];
  }
  typeQueue.chars.push(...text.split(""));
  if (typeQueue.timer) return;

  const caret = document.createElement("span");
  caret.className = "caret";
  el.appendChild(caret);

  typeQueue.timer = setInterval(() => {
    if (typeQueue.chars.length === 0) {
      clearInterval(typeQueue.timer);
      typeQueue.timer = null;
      caret.remove();
      return;
    }
    // 每拍 2 个字符，长句不至于太慢；稍后仍可调
    const ch = typeQueue.chars.splice(0, 2).join("");
    caret.insertAdjacentText("beforebegin", ch);
    scrollBottom();
  }, 18);
}

/* ============================================================
   工具
   ============================================================ */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function scrollBottom() {
  const c = $("chat");
  c.scrollTop = c.scrollHeight;
}

/* ============================================================
   启动：有 token 直接进主界面（token 过期由接口 401 提示）
   ============================================================ */
if (S.token) enterApp();
</script>
</body>
</html>
