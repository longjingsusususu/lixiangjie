<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}管理后台{% endblock %} · 会议活动需求</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin">
<aside class="side">
  <div class="logo">会议活动需求<span>管理后台</span></div>
  <nav>
    <a href="/admin" class="{{ 'on' if active=='overview' }}">概览</a>
    <a href="/admin/items" class="{{ 'on' if active=='items' }}">需求项库{% if not items_ready %}<i class="soon">批 2</i>{% endif %}</a>
    <a href="/admin/import" class="{{ 'on' if active=='import' }}">批量导入{% if not import_ready %}<i class="soon">批 2</i>{% endif %}</a>
    <a href="/admin/rules" class="{{ 'on' if active=='rules' }}">规则配置{% if not rules_ready %}<i class="soon">批 3</i>{% endif %}</a>
    <a href="/admin/audit" class="{{ 'on' if active=='audit' }}">查询审计{% if not audit_ready %}<i class="soon">批 4</i>{% endif %}</a>
    <a href="/admin/tools" class="{{ 'on' if active=='tools' }}">Agent 工具</a>
    <a href="/admin/agent" class="{{ 'on' if active=='agent' }}">Agent 轨迹</a>
    <a href="/admin/users" class="{{ 'on' if active=='users' }}">用户与角色</a>
  </nav>
  <div class="side-foot">
    <div class="who">{{ user.display_name }}<span>{{ role_cn }}</span></div>
    <a class="out" href="/logout">退出</a>
  </div>
</aside>
<main class="main">
  {% block body %}{% endblock %}
</main>
</body>
</html>
