<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>需求项管家 · Agent 对话</title>
<!--
  Agent 对话页（原生 JS，无构建）
  · 一轮对话 = POST /api/agent/chat，读 SSE 流：run/decide/tool/observe/draft/interrupt/final/done
  · 中断后出现「确认卡」：确认 → POST /api/agent/confirm {accept:true}，取消 → {accept:false}
  · 右侧「执行轨迹」实时展示每一轮决策与工具耗时（就是 agent_steps 的前端投影）
  · 鉴权：登录拿 JWT 存内存（演示用；正式环境走 HttpOnly cookie 或 BFF）
-->
<style>
  :root{
    --bg:#f6f7f9;--panel:#fff;--line:#e5e7eb;--text:#1f2328;--sub:#6b7280;
    --brand:#2f6feb;--brand-soft:#eaf1fe;--ok:#067647;--ok-soft:#ecfdf3;
    --warn:#b54708;--warn-soft:#fffaeb;--danger:#d92d20;--danger-soft:#fef3f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px}
  input{font:inherit;outline:none}

  /* 登录 */
  #login{height:100vh;display:flex;align-items:center;justify-content:center}
  .lcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;
         width:350px;box-shadow:0 8px 28px rgba(15,23,42,.06)}
  .lcard h1{font-size:17px;margin-bottom:4px}
  .lcard p{color:var(--sub);font-size:12.5px;margin-bottom:18px}
  .lcard input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
  .lcard button{width:100%;padding:10px;background:var(--brand);color:#fff}

  /* 主布局 */
  #app{display:none;height:100vh;grid-template-columns:1fr 330px}
  #main{display:flex;flex-direction:column;min-width:0}
  .top{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);
       display:flex;align-items:center;justify-content:space-between}
  .top b{font-size:14.5px}
  .top span{color:var(--sub);font-size:12px}
  #chat{flex:1;overflow-y:auto;padding:22px 0}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}

  /* 消息 */
  .msg{margin-bottom:16px}
  .q{background:var(--brand);color:#fff;padding:10px 14px;border-radius:12px 12px 3px 12px;
     margin-left:auto;max-width:80%;width:fit-content}
  .a{background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 12px 3px;
     padding:14px 16px;white-space:pre-wrap;max-width:92%}
  .a.err{background:var(--danger-soft);border-color:#fecdca;color:#b42318}

  /* 轨迹条（对话内） */
  .trace{font-size:12px;color:var(--sub);margin:6px 0 2px;display:flex;flex-wrap:wrap;gap:6px}
  .step{padding:2px 8px;border-radius:6px;background:#f1f3f6;border:1px solid var(--line);
        font-family:ui-monospace,Consolas,monospace}
  .step.ok{border-color:#abefc6;background:var(--ok-soft);color:var(--ok)}
  .step.bad{border-color:#fecdca;background:var(--danger-soft);color:#b42318}
  .step.think{background:#eef4ff;border-color:#c7d7fb;color:var(--brand)}

  /* 中断确认卡 */
  .draft{border:1px solid #c7d7fb;background:#fbfdff;border-radius:12px;padding:14px 16px;margin-top:10px}
  .draft h4{font-size:13px;color:var(--brand);margin-bottom:8px}
  .draft pre{font:12.5px/1.7 ui-monospace,Consolas,"Microsoft YaHei",monospace;
             white-space:pre-wrap;color:#374151;background:#fff;border:1px solid var(--line);
             border-radius:8px;padding:12px;min-height:60px}
  .draft .acts{display:flex;gap:8px;margin-top:10px;align-items:center}
  .yes{padding:8px 16px;background:var(--brand);color:#fff;font-weight:500}
  .no{padding:8px 16px;background:#fff;border:1px solid var(--line);color:#374151}
  .draft .tip{font-size:12px;color:var(--sub);margin-left:auto}

  /* 输入区 */
  .composer{padding:12px 20px 18px;background:var(--panel);border-top:1px solid var(--line)}
  .cwrap{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  .cwrap input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:10px}
  .cwrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .cwrap button{padding:11px 18px;background:var(--brand);color:#fff;font-weight:500}
  .cwrap button:disabled{opacity:.5;cursor:not-allowed}
  .sugg{max-width:720px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap}
  .sugg button{font-size:12px;padding:5px 11px;background:#fff;border:1px solid var(--line);color:var(--sub)}
  .sugg button:hover{border-color:var(--brand);color:var(--brand)}

  /* 右侧轨迹面板 */
  #side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
  #side .h{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
  #side .h small{display:block;font-weight:400;color:var(--sub);font-size:11.5px;margin-top:3px}
  #side .body{flex:1;overflow-y:auto;padding:10px 12px;font-size:12px}
  .row{padding:7px 8px;border-radius:7px;margin-bottom:6px;background:#fafbfc;border:1px solid var(--line)}
  .row .n{color:var(--sub);font-size:11px}
  .row .t{font-family:ui-monospace,Consolas,monospace;color:#374151}
  .row .d{color:var(--sub);font-size:11.5px;word-break:break-all}
  .empty{color:var(--sub);text-align:center;padding:30px 10px;font-size:12px}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="lcard">
    <h1>需求项管家（Agent）</h1>
    <p>会查、会诊、会校验；写操作必须你确认后才执行。</p>
    <input id="u" placeholder="用户名，如 tangyq" value="">
    <input id="p" type="password" placeholder="密码，如 123456" value="">
    <button onclick="login()">进入</button>
    <p id="lerr" style="color:#b42318;margin-top:10px;min-height:18px"></p>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <div id="main">
    <div class="top">
      <b>需求项管家</b>
      <span id="who"></span>
    </div>
    <div id="chat"><div class="wrap" id="msgs"></div></div>
    <div class="composer">
      <div class="sugg">
        <button onclick="fill('双语主持相关的需求有哪些？')">双语主持有哪些需求</button>
        <button onclick="fill('把 LS-02 交接给傅景，截止 11-05')">把 LS-02 交接给傅景</button>
        <button onclick="fill('LS-02 现在能交接吗？')">LS-02 能交接吗</button>
        <button onclick="fill('EQ-05 的翻译间到底几间？')">EQ-05 三源对不上</button>
      </div>
      <div class="cwrap">
        <input id="q" placeholder="说你要做什么，比如『把 LS-02 交接给傅景，截止 11-05』"
               onkeydown="if(event.key==='Enter')send()">
        <button id="sendBtn" onclick="send()">发送</button>
      </div>
    </div>
  </div>

  <div id="side">
    <div class="h">执行轨迹<small>决策 → 执行 → 回填，最多 5 轮</small></div>
    <div class="body" id="traceBody"><div class="empty">还没有执行</div></div>
  </div>
</div>

<script>
/* ============================================================
   状态
   ============================================================ */
let TOKEN = '';           // 演示：内存里存 JWT
let busy = false;
let RUN = null;           // 当前 run_id（中断后确认要用）

const $ = s => document.querySelector(s);
const msgs = () => $('#msgs');
const traceBody = () => $('#traceBody');

/* ============================================================
   登录
   ============================================================ */
async function login() {
  const r = await fetch('/api/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: $('#u').value.trim(), password: $('#p').value})
  });
  const d = await r.json();
  if (!r.ok) { $('#lerr').textContent = `[${d.code}] ${d.message}`; return; }
  TOKEN = d.token;
  $('#who').textContent = `${d.display_name} · ${d.role}`;
  $('#login').style.display = 'none';
  $('#app').style.display = 'grid';
  addAssistant('我是需求项管家。你可以问我清单、让我建交接、或核对三源是否一致。\n写操作我会先给你看草稿，你点确认后才真正执行。');
}

/* ============================================================
   渲染小工具
   ============================================================ */
function scrollBottom() { const c = $('#chat'); c.scrollTop = c.scrollHeight; }

function addQuestion(text) {
  const d = document.createElement('div');
  d.className = 'msg q'; d.textContent = text;
  msgs().appendChild(d); scrollBottom();
}

function addAssistant(text) {
  const d = document.createElement('div');
  d.className = 'msg a'; d.textContent = text;
  msgs().appendChild(d); scrollBottom();
  return d;
}

function addTraceLine(html) {
  const d = document.createElement('div');
  d.className = 'trace'; d.innerHTML = html;
  msgs().appendChild(d); scrollBottom();
  return d;
}

/* 右侧面板：一行一个 step（与 agent_steps 同构，便于对照） */
function pushStep(round, phase, tool, detail, cls) {
  const body = traceBody();
  if (body.querySelector('.empty')) body.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `<div class="n">第 ${round} 轮 · ${phase}</div>
                 <div class="t ${cls || ''}">${tool || '—'}</div>
                 <div class="d">${detail || ''}</div>`;
  body.appendChild(d);
  body.scrollTop = body.scrollHeight;
}

function fill(t) { $('#q').value = t; $('#q').focus(); }

/* ============================================================
   发送：SSE 手工解析（fetch + ReadableStream，逐帧处理）
   ============================================================ */
async function send() {
  if (busy) return;
  const goal = $('#q').value.trim();
  if (!goal) return;
  busy = true; $('#sendBtn').disabled = true; $('#q').value = '';
  traceBody().innerHTML = '<div class="empty">执行中…</div>';
  addQuestion(goal);

  const holder = addAssistant('');      // 结论占位，final 时填
  holder.textContent = '正在理解你的诉求…';
  const traceLine = addTraceLine('');

  let draftPre = null;                  // 草稿区（draft 帧逐行追加到这里）
  try {
    const r = await fetch('/api/agent/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN},
      body: JSON.stringify({goal})
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({code: r.status, message: '请求失败'}));
      holder.className = 'msg a err';
      holder.textContent = `[${e.code}] ${e.message}`;
      return;
    }

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});

      // SSE 帧以空行分隔
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let ev = '', data = '';
        for (const line of frame.split('\n')) {
          if (line.startsWith('event: ')) ev = line.slice(7).trim();
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (!ev || !data) continue;
        const d = JSON.parse(data);
        handle(ev, d, holder, traceLine, () => draftPre, v => { draftPre = v; });
      }
    }
  } catch (e) {
    holder.className = 'msg a err';
    holder.textContent = '连接中断：' + e;
  } finally {
    busy = false; $('#sendBtn').disabled = false; scrollBottom();
  }
}

/* 单个 SSE 事件的处理（每种事件对应一种视觉反馈） */
function handle(ev, d, holder, traceLine, getDraft, setDraft) {
  switch (ev) {
    case 'run':
      RUN = d.run_id;
      holder.textContent = `已识别意图：${d.intent}（决策方：${d.decider}）`;
      pushStep(0, 'run', d.run_id, `意图 ${d.intent}`);
      break;

    case 'decide': {
      const a = d.action;
      traceLine.innerHTML += `<span class="step think">第${d.round}轮 决策 → ${a.type === 'final' ? '收束' : a.tool}</span>`;
      pushStep(d.round, 'decide', a.type === 'final' ? '（收束）' : a.tool, a.why || '');
      break;
    }

    case 'tool':
      traceLine.innerHTML += `<span class="step">${d.tool} 执行中…</span>`;
      break;

    case 'observe':
      traceLine.innerHTML += `<span class="step ${d.ok ? 'ok' : 'bad'}">${d.tool} ${d.ok ? '✓' : '✗'} ${d.duration_ms}ms</span>`;
      pushStep(d.round, 'act', d.tool,
        `${d.digest || ''}${d.ok ? '' : '｜' + d.message}`, d.ok ? 'ok' : 'bad');
      break;

    case 'draft': {
      if (!getDraft()) {
        const wrap = document.createElement('div');
        wrap.className = 'msg a draft';
        wrap.innerHTML = `<h4>待你确认（确认前不会写入任何数据）</h4>
                          <pre></pre>
                          <div class="acts">
                            <button class="yes" onclick="confirmRun(this, true)">确认执行</button>
                            <button class="no" onclick="confirmRun(this, false)">取消</button>
                            <span class="tip">确认后票据一次性作废</span>
                          </div>`;
        msgs().appendChild(wrap);
        setDraft(wrap.querySelector('pre'));
      }
      getDraft().textContent += d.delta;     // 逐行写出来（打字机）
      scrollBottom();
      break;
    }

    case 'interrupt':
      holder.textContent = '已暂停：这是写操作，需要你确认。请看上面的草稿卡片。';
      traceLine.innerHTML += `<span class="step bad">中断 · 等人工确认</span>`;
      pushStep(d.round, 'interrupt', d.tool, '等待人工确认（未落库）');
      break;

    case 'final':
      holder.className = 'msg a';
      holder.textContent = d.answer;
      pushStep(0, 'final', '（结论）', '');
      break;

    case 'done':
      pushStep(d.rounds, 'done', '结束', `状态 ${d.status}`);
      break;

    case 'error':
      holder.className = 'msg a err';
      holder.textContent = `[${d.code}] ${d.message}`;
      break;
  }
  scrollBottom();
}

/* ============================================================
   确认 / 取消
   ============================================================ */
async function confirmRun(btn, accept) {
  if (!RUN) return;
  const acts = btn.parentElement;
  acts.innerHTML = '<span class="tip">处理中…</span>';
  const r = await fetch('/api/agent/confirm', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN},
    body: JSON.stringify({run_id: RUN, accept})
  });
  const d = await r.json();
  const card = acts.closest('.draft');
  if (!r.ok) {
    acts.innerHTML = `<span class="tip" style="color:#b42318">[${d.code}] ${d.message}</span>`;
    return;
  }
  acts.innerHTML = `<span class="tip">${accept ? '已确认执行' : '已取消'}</span>`;
  card.style.borderColor = accept ? '#abefc6' : '#e5e7eb';

  // 用返回的 events 继续渲染（与 SSE 同样的处理函数，保证一致）
  for (const e of (d.events || [])) {
    if (e.type === 'observe') pushStep(e.round, 'act', e.tool,
      `${e.digest || ''}${e.ok ? '' : '｜' + e.message}`, e.ok ? 'ok' : 'bad');
    if (e.type === 'final') pushStep(0, 'final', '（结论）', '');
  }
  const holder = addAssistant(d.answer);
  if (d.status === 'cancelled') holder.className = 'msg a';
  RUN = null;
}
</script>
</body>
</html>
